name: CI

# We can specify which Github events will trigger a CI build.
on: push

# now define a single job 'build' (but could define more)
jobs:

  build:

    # Here we add the matrices definition:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.14", "3.15"]
    
    # Here we add the reference to the os matrix values
    runs-on: ${{ matrix.os }}
    # needed so conda activation works in each step
    defaults:
      run:
        shell: bash -el {0}

    # a job is a sequence of steps
    steps:

      # Next we need to checkout our repository and set up Python.
      # A 'name' is just a label for the step, and 'uses' specifies an action to run.
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up conda environment with Python ${{ matrix.python-version }}
        uses: conda-incubator/setup-miniconda@v3
        with:
        # Here we add the reference to the python-version matrix values
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: inflammation
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"

      - name: Check environment
        run: |
          conda info
          conda list
      
      - name: Run tests
        run: |
          python -m pytest --cov=inflammation.models tests/test_models.py
